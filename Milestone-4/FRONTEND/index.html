<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Conversational IVR</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

min-height:100vh;

background:
linear-gradient(-45deg,#050816,#101b3d,#07172e,#24104f);

background-size:400% 400%;

animation:bg 12s infinite;

display:flex;
justify-content:center;
align-items:center;

color:white;

}


@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}



.container{

width:1200px;

max-width:95%;

display:grid;

grid-template-columns:380px 1fr;

gap:30px;

}




.card{


background:

rgba(255,255,255,0.08);


border:

1px solid rgba(255,255,255,.2);


backdrop-filter:blur(25px);


border-radius:30px;


padding:30px;


box-shadow:

0 30px 80px rgba(0,0,0,.5);

}




.header{

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:25px;

font-weight:900;


background:

linear-gradient(90deg,#00ffd5,#8b7bff);


-webkit-background-clip:text;

color:transparent;

}



.status{

background:#00e676;

color:#001;

padding:8px 18px;

border-radius:30px;

font-size:12px;

font-weight:bold;

box-shadow:0 0 20px #00e676;

}




.ai-circle{

position:relative;

width:150px;

height:150px;

margin:45px auto;


border-radius:50%;


background:

linear-gradient(135deg,#00ffd5,#765cff);


display:flex;

align-items:center;

justify-content:center;


font-size:60px;


box-shadow:

0 0 60px #00ffd5;


animation:float 3s infinite;

}



.ai-circle::before,
.ai-circle::after{


content:"";

position:absolute;

width:180px;

height:180px;


border-radius:50%;


border:2px solid #00ffd5;


animation:ring 2s infinite;

}



.ai-circle::after{

animation-delay:1s;

}



@keyframes ring{


100%{

transform:scale(1.7);

opacity:0;

}

}




@keyframes float{

50%{

transform:translateY(-15px);

}

}




.timer{

text-align:center;

font-size:40px;

font-weight:bold;

color:#00ffd5;

text-shadow:0 0 20px #00ffd5;

}




.call-actions{

display:flex;

gap:15px;

margin-top:30px;

}



button{

flex:1;

padding:15px;

border:none;

border-radius:18px;

font-size:15px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-5px);

box-shadow:0 15px 30px rgba(0,0,0,.4);

}




.start{

background:

linear-gradient(90deg,#00ffd5,#7b70ff);

}



.end{

background:

linear-gradient(90deg,#ff416c,#ff4b2b);

color:white;

}



.voice{

margin-top:15px;

width:100%;

background:#ffffff20;

color:white;

border:1px solid white;

}





.info{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:12px;

margin-top:30px;

}



.box{

background:#ffffff12;

padding:18px;

border-radius:20px;

text-align:center;

}



.box h2{

color:#00ffd5;

font-size:28px;

}




/* CHAT */


.chat{

height:520px;

overflow:auto;

padding:15px;

}




.message{

max-width:75%;

padding:18px;

border-radius:25px;

margin:15px 0;

animation:slide .4s;

}



@keyframes slide{

from{

opacity:0;

transform:translateY(20px);

}

}



.ivr{

background:

linear-gradient(135deg,#202b55,#334b9b);

}



.user{

margin-left:auto;

background:

linear-gradient(135deg,#00ffd5,#00bfa6);

color:#001;

}




.tag{

font-size:11px;

opacity:.7;

margin-bottom:8px;

}



.input-area{

display:flex;

gap:15px;

}



input{

flex:1;

padding:18px;

border-radius:20px;

border:none;

outline:none;

background:#ffffff15;

color:white;

font-size:16px;

}




.send{

background:

linear-gradient(90deg,#7b70ff,#00ffd5);

color:white;

}




@media(max-width:800px){

.container{

grid-template-columns:1fr;

}

}



</style>

</head>



<body>


<div class="container">


<!-- LEFT PANEL -->

<div class="card">


<div class="header">

<div class="logo">

🤖 AI IVR

</div>


<div class="status">

ONLINE

</div>


</div>




<div class="ai-circle">

🎙️

</div>



<div class="timer" id="timer">

00:00

</div>




<div class="call-actions">


<button class="start" id="startBtn">

Start Call

</button>



<button class="end" id="endBtn">

Hang Up

</button>


</div>




<button class="voice" id="voiceBtn">

🎤 Speak

</button>





<div class="info">


<div class="box">

<h2 id="active">

0

</h2>

Active

</div>


<div class="box">

<h2 id="total">

0

</h2>

Calls

</div>


<div class="box">

<h2>

AI

</h2>

NLP

</div>


</div>



</div>






<!-- CHAT PANEL -->


<div class="card">


<h2>

💬 AI Conversation

</h2>



<div class="chat" id="chat">


<div class="message ivr">


<div class="tag">

AI IVR

</div>


Welcome! Click Start Call to begin.


</div>



</div>




<div class="input-area">


<input id="textInput"

placeholder="Ask something...">



<button class="send" onclick="sendText()">

Send

</button>


</div>



</div>


</div>







<script>


const API =
"https://ai-enabled-conversational-ivr-ste4.onrender.com";



let callSession=null;

let startTime;

let timer;



const chat=document.getElementById("chat");





function addMessage(text,type="ivr"){


let div=document.createElement("div");


div.className="message "+type;



div.innerHTML=

`

<div class="tag">

${type==="ivr"?"AI":"You"}

</div>


${text}

`;



chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;



if(type==="ivr")

speak(text);


}





function speak(text){

let speech=new SpeechSynthesisUtterance(text);

speech.lang="en-US";

speechSynthesis.speak(speech);

}





function typing(){


let div=document.createElement("div");


div.className="message ivr";

div.id="typing";


div.innerHTML=

`

<div class="tag">

AI

</div>


Thinking...

`;

chat.appendChild(div);


}




function removeTyping(){

let t=document.getElementById("typing");

if(t)

t.remove();

}




document.getElementById("startBtn")
.onclick=async()=>{


let res=await fetch(API+"/ivr/start",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

caller_number:"+911111111111"

})

});


let data=await res.json();


callSession=data.call_id;


addMessage(data.prompt);


startTimer();


};






document.getElementById("endBtn")
.onclick=async()=>{


if(!callSession)

return;



await fetch(

API+"/ivr/end?call_id="+callSession,

{

method:"POST"

}

);



addMessage("Call disconnected");


callSession=null;


};






function startTimer(){


startTime=Date.now();



timer=setInterval(()=>{


let s=Math.floor(

(Date.now()-startTime)/1000

);



document.getElementById("timer").innerHTML=


String(Math.floor(s/60)).padStart(2,"0")

+

":"

+

String(s%60).padStart(2,"0");



},1000);



}







async function sendText(){


let text=document.getElementById("textInput").value;


if(!text)

return;



addMessage(text,"user");



typing();



let res=await fetch(API+"/ivr/voice",{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

call_id:callSession,

text:text

})


});



let data=await res.json();



removeTyping();


addMessage(data.prompt);


}







let recognition;



if("webkitSpeechRecognition" in window){


recognition=new webkitSpeechRecognition();


recognition.lang="en-IN";



recognition.onresult=e=>{


let text=e.results[0][0].transcript;


addMessage(text,"user");


sendVoice(text);


};


}





document.getElementById("voiceBtn")
.onclick=()=>{


if(recognition)

recognition.start();


};








async function sendVoice(text){


typing();


let res=await fetch(API+"/ivr/voice",{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

call_id:callSession,

text:text

})


});



let data=await res.json();


removeTyping();


addMessage(data.prompt);


}



</script>



</body>

</html>

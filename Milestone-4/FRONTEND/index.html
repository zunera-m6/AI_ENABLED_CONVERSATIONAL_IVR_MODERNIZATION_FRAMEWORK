<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Conversational IVR</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}


body{

    min-height:100vh;

    background:
    radial-gradient(circle at top,#263b7a,#080d20 45%);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

}


.container{

    width:1100px;
    max-width:95%;

    display:grid;

    grid-template-columns:420px 1fr;

    gap:25px;

}


/* LEFT PANEL */

.card{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:25px;

    padding:25px;

    box-shadow:0 20px 50px rgba(0,0,0,.4);

}



.header{

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.logo{

    font-size:22px;

    font-weight:800;

    color:#63f5c6;

}


.status{

    padding:7px 15px;

    border-radius:20px;

    background:#1bc47d;

    font-size:12px;

}



.ai-circle{

    width:120px;
    height:120px;

    margin:30px auto;

    border-radius:50%;

    background:
    linear-gradient(135deg,#63f5c6,#7b70ff);

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:45px;


    animation:pulse 2s infinite;

}


@keyframes pulse{

50%{
    transform:scale(1.08);

    box-shadow:0 0 50px #63f5c6;
}

}



.timer{

    text-align:center;

    font-size:30px;

    color:#63f5c6;

}



.call-actions{

    display:flex;

    gap:10px;

    margin-top:25px;

}


button{

    flex:1;

    padding:14px;

    border:none;

    border-radius:15px;

    cursor:pointer;

    font-weight:bold;

    font-size:15px;

}



.start{

background:
linear-gradient(90deg,#63f5c6,#7b70ff);

color:#111;

}


.end{

background:#ff4b5c;

color:white;

}


.voice{

background:#ffffff20;

color:white;

border:1px solid white;

}





/* CHAT */


.chat{

height:520px;

overflow:auto;

padding:15px;

}



.message{

max-width:75%;

padding:15px;

border-radius:20px;

margin:12px 0;

animation:show .3s;

}



@keyframes show{

from{

opacity:0;
transform:translateY(20px);

}

}



.ivr{

background:#24325f;

}


.user{

background:#63f5c6;

color:#111;

margin-left:auto;

}



.tag{

font-size:11px;

opacity:.6;

margin-bottom:5px;

}



.input-area{

display:flex;

gap:10px;

}



input{

flex:1;

padding:15px;

border-radius:15px;

border:none;

background:#ffffff15;

color:white;

outline:none;

}




.send{

background:#7b70ff;

color:white;

}





/* INFO */

.info{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

margin-top:20px;

}


.box{

background:#ffffff10;

padding:15px;

border-radius:15px;

text-align:center;

}


.box h2{

color:#63f5c6;

}



@media(max-width:800px){

.container{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<div class="container">


<!-- LEFT -->

<div class="card">


<div class="header">

<div class="logo">
🤖 AI IVR Assistant
</div>


<div class="status" id="status">
Online
</div>


</div>



<div class="ai-circle">
🎙️
</div>



<div class="timer" id="timer">
00:00
</div>



<div class="call-actions">


<button class="start" id="startBtn">
Start Call
</button>


<button class="end" id="endBtn">
Hang Up
</button>


</div>


<button class="voice" id="voiceBtn">

🎤 Speak

</button>



<div class="info">


<div class="box">

<h2 id="active">
0
</h2>

Active

</div>


<div class="box">

<h2 id="total">
0
</h2>

Calls

</div>


<div class="box">

<h2>
AI
</h2>

NLP

</div>


</div>


</div>





<!-- RIGHT -->


<div class="card">


<h2>
💬 Conversation
</h2>


<div class="chat" id="chat">


<div class="message ivr">

<div class="tag">
IVR
</div>

Welcome! Press Start Call to begin.

</div>


</div>




<div class="input-area">

<input id="textInput"
placeholder="Type your request...">


<button class="send" onclick="sendText()">

Send

</button>


</div>



</div>


</div>





<script>


const API=
"https://ai-enabled-conversational-ivr-ste4.onrender.com";


let callSession=null;

let startTime;

let timer;



const chat=document.getElementById("chat");



function addMessage(text,type="ivr"){


let div=document.createElement("div");


div.className="message "+type;


div.innerHTML=

`
<div class="tag">
${type==="ivr"?"IVR":"You"}
</div>

${text}

`;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


if(type==="ivr")
speak(text);

}





function speak(text){

let u=new SpeechSynthesisUtterance(text);

u.lang="en-US";

speechSynthesis.speak(u);

}





document.getElementById("startBtn")
.onclick=async()=>{


let res=await fetch(API+"/ivr/start",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

caller_number:"+911111111111"

})

});


let data=await res.json();


callSession=data.call_id;


addMessage(data.prompt);


startTimer();


};






document.getElementById("endBtn")
.onclick=async()=>{


if(!callSession)return;


await fetch(API+
"/ivr/end?call_id="+callSession,

{
method:"POST"
});


addMessage(
"Call disconnected"
);


callSession=null;


};







function startTimer(){


startTime=Date.now();


timer=setInterval(()=>{


let s=Math.floor(
(Date.now()-startTime)/1000
);


document.getElementById("timer")
.innerHTML=

Math.floor(s/60)
.toString()
.padStart(2,"0")

+
":"

+

(s%60)
.toString()
.padStart(2,"0");


},1000);


}








async function sendText(){


let text=
document.getElementById("textInput").value;


if(!text)return;


addMessage(text,"user");


let res=
await fetch(API+"/ivr/voice",{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

call_id:callSession,

text:text

})


});


let data=await res.json();


addMessage(data.prompt);


}








// VOICE


let recognition;


if("webkitSpeechRecognition" in window){


recognition=
new webkitSpeechRecognition();


recognition.lang="en-IN";


recognition.onresult=e=>{


let text=
e.results[0][0].transcript;


addMessage(text,"user");


sendVoice(text);


};


}



document.getElementById("voiceBtn")
.onclick=()=>{


recognition.start();


};





async function sendVoice(text){


let res=
await fetch(API+"/ivr/voice",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

call_id:callSession,

text:text

})

});


let data=await res.json();


addMessage(data.prompt);


}



</script>



</body>

</html>
